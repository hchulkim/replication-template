name: build_docker

on:
  push:
    branches: [ master, main ]

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: r_4.5.1   # repo name on Docker Hub: DOCKERHUB_USERNAME/r_4.5.1
      IMAGE_NAME_2: r_julia_quarto # repo name on Docker Hub: DOCKERHUB_USERNAME/r_julia_quarto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enable QEMU so we can cross-build arm64 on amd64 runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Buildx builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #- name: Build and push (multi-arch) base Dockerfile
      #  uses: docker/build-push-action@v6
      #  with:
      #    context: .
      #    file: ./Dockerfile
      #    platforms: linux/amd64,linux/arm64   # <-- key line
      #    push: true
      #    # tag strategy: latest + branch + short sha
      #    tags: |
      #      ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
      #      ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
      #      ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}
      #    cache-from: type=gha
      #    cache-to: type=gha,mode=max
      #    pull: true
          
      - name: Build and push (multi-arch) Dockerfile with R, Julia, and Quarto setup
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_r_julia_quarto
          platforms: linux/amd64,linux/arm64   # <-- key line
          push: true
          # tag strategy: latest + branch + short sha
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME_2 }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME_2 }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME_2 }}:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true

