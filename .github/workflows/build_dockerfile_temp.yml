name: build_docker

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: r_4.5.1   # repo name on Docker Hub: DOCKERHUB_USERNAME/r_4.5.1
      IMAGE_NAME_2: r_julia_quarto # repo name on Docker Hub: DOCKERHUB_USERNAME/r_julia_quarto
      IMAGE_NAME_TEMP: climate_pest # temporary repo name on Docker Hub for setting an environment for specific research
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enable QEMU so we can cross-build arm64 on amd64 runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Buildx builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push (multi-arch) Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_temp
          platforms: linux/amd64,linux/arm64   # <-- key line
          push: true
          # tag strategy: latest + branch + short sha
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME_TEMP }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME_TEMP }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME_TEMP }}:${{ github.ref_name }}-${{ github.sha }}
          pull: true
